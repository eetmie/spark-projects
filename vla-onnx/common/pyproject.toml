[project]
name = "vla-common"
version = "0.1.0"
description = "Shared plumbing for the LeRobot VLA -> split ONNX -> Orin Nano pipeline"
requires-python = ">=3.12"

# Deliberately NO pins on torch/lerobot/transformers: the pipeline environment
# (.venv-lerobot061) owns those. Anything version-sensitive belongs in a model playbook,
# not here. `onnx` is imported lazily inside the functions that need it.
dependencies = []

[project.optional-dependencies]
dataset = ["pandas", "numpy", "pyarrow", "av"]   # only vla_common.dataset needs these

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vla_common*"]
